                let min_width_gap = (depth === 3) ? 0.01 : 0.015;

                        item_loc: path, 
                        start_tree: get_tree(depth),
                        depth: depth,
                        title: `Alien Group ${expt_data.names[i]}`,

                data.num_correct = 6;
            } else {
                data.pass = false;
                data.num_correct = Number(answers.q1 === 'True') + Number( answers.q2 === 'True') +  Number(answers.q3 === 'True') + Number(answers.q4 === 'Red') + Number(answers.q5 === 'False') + Number(answers.q6 === 'False');
            }
            data.attempts = practice_attempts;

        }
    }

    var feedback = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function(){
            var pass_to_exp = jsPsych.data.get().last(1).values()[0].pass; 
            var num_correct = jsPsych.data.get().last(1).values()[0].num_correct;
            var html_str = `<h3> ${num_correct}/6 </h3>`;
            if (pass_to_exp) {
                return html_str +
                 "<p style='font-size: 18px;'>All correct! Press the 'S' key to begin classifying aliens.</p>"
            }else if (practice_attempts === MAX_PRACTICE) {
                return html_str + 
                `<p style='font-size: 18px;'> You have reached the maximum number of attempts (${MAX_PRACTICE}) to answer the questions. You will now be taken to the experiment. Press the 'S' key to begin classifying aliens.`

            }else{
                return  html_str +
                "<p style='font-size: 18px;'> Some answers are incorrect. Press the 'R' key to return to return to the start of the instructions. <b>Please pay close attention to the information provided in the tutorial.</b></p>"
            }
        },
        choices: function() {
            var pass_to_exp = jsPsych.data.get().last(1).values()[0].pass; 
            var num_correct = jsPsych.data.get().last(1).values()[0].num_correct;
            if (pass_to_exp) {
                return ['S']
             } else if (practice_attempts === MAX_PRACTICE) {
                 return ['S']
            } else {
                return ['R']
            }

        },
        data: {'part': 'sanity-feedback'}
    }

    var skip_practice_trial = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div style="max-width: 600px; margin: 0 auto; font-family: sans-serif;">
                <h3>Skip Tutorial?</h3>
                <p>For the purposes of this demo you can choose to complete the tutorial or skip directly to the main alien categorization task. <b>Warning</b> if you skip the tutorial, you will also skip the initial task instructions.</p>
            </div>
        `,
        choices: ['Start Practice', 'Skip to Main Task'],
        data: { part: 'skip_practice_choice' }
    };

    var practice_loop = {
        timeline: [instructions, tutorial_1, tutorial_debrief_1, tutorial_2, 
        tutorial_debrief_2, tutorial_3, tutorial_debrief_3, tutorial_4, tutorial_debrief_4, sanityCheck, feedback],
        loop_function: function(data) {
            if (data.values()[9].pass === true || practice_attempts === MAX_PRACTICE) { 
                return false; 
            } else { 
                practice_attempts++;
                return true;
           }
        },
        data: {'part': 'tutorial'},
    }

    var practice_conditional_node = {
        timeline: [practice_loop],
        conditional_function: function() {
            var last_trial_data = jsPsych.data.get().filter({ part: 'skip_practice_choice' }).last(1).values()[0];
            if (last_trial_data.response === 1) {
                return false; 
            } else {
                return true;  
            }
        }
    };

    timeline.push(skip_practice_trial);
    timeline.push(practice_conditional_node);

    var experiment_body = {
        timeline: get_trials()
    }
    timeline.push(experiment_body);

    /* start the experiment */
    jsPsych.run(timeline);	
    </script>
</body>
